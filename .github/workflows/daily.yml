name: Build dashboard (private)

on:
  schedule:
    - cron: "17 23 * * *"   # 매일 오전 8:17 (KST)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

permissions:
  contents: read             # repo에 아무것도 쓰지 않음 (Pages 배포 없음)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          AIRBRIDGE_API_TOKEN: ${{ secrets.AIRBRIDGE_API_TOKEN }}
          TZ: Asia/Seoul
        run: python generate.py --from "$(date -d '60 days ago' +%F)" --to "$(date -d 'yesterday' +%F)"

      - name: Upload dashboard (로그인한 본인만 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: tmoneygo-dashboard-${{ github.run_number }}
          path: dashboard.html
          retention-days: 14
