name: tmoneygo dashboard daily

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: pip install -r requirements.txt
      - name: generate
        env:
          AIRBRIDGE_API_TOKEN: ${{ secrets.AIRBRIDGE_API_TOKEN }}
        run: |
          TO=$(TZ=Asia/Seoul date -d 'yesterday' +%F)
          FROM=$(TZ=Asia/Seoul date -d '14 days ago' +%F)
          python generate.py --from "$FROM" --to "$TO"
          mkdir -p public && cp dashboard.html public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deploy
        uses: actions/deploy-pages@v4
